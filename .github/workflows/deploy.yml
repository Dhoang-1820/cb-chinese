# Deploys the app to GitHub Pages and generates neural-voice audio on the way.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate content
        run: node tools/validate.js

      # Reuse MP3s from earlier runs; only new or changed sentences are generated.
      - name: Restore audio cache
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-${{ hashFiles('data/*.js', 'tools/gen_audio.py', 'tools/collect_texts.js') }}
          restore-keys: audio-

      - name: Generate audio (edge-tts)
        run: |
          pip install edge-tts
          node tools/collect_texts.js > audio_texts.json
          python tools/gen_audio.py audio_texts.json

      # Bundles + minifies (esbuild), splits start-up data from lazy data, stamps the version.
      - name: Build site
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2
          node tools/build.js _site "$GITHUB_SHA"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Speed check of the live site on a simulated mid-range phone. Informational only:
  # it never blocks a deploy. Open the run's log for the scores and a link to the full report.
  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun --collect.url="${{ needs.deploy.outputs.page_url }}"
