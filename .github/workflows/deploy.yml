# Deploys the app to GitHub Pages and generates neural-voice audio on the way.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate content
        run: node tools/validate.js

      # Reuse MP3s from earlier runs; only new or changed sentences are generated.
      - name: Restore audio cache
        uses: actions/cache@v4
        with:
          path: audio
          key: audio-${{ hashFiles('data/*.js', 'tools/gen_audio.py', 'tools/collect_texts.js') }}
          restore-keys: audio-

      - name: Generate audio (edge-tts)
        run: |
          pip install edge-tts
          node tools/collect_texts.js > audio_texts.json
          python tools/gen_audio.py audio_texts.json

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data audio icons _site/
          sed -i "s/var VERSION = \"dev\";/var VERSION = \"${GITHUB_SHA::8}\";/" _site/sw.js
          sed -i "s/var BUILD = \"dev\";/var BUILD = \"${GITHUB_SHA::8}\";/" _site/js/app.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
