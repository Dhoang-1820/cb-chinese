# Deploys the app to GitHub Pages and generates neural-voice audio on the way.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # every night (02:17 in Vietnam): questions approved in the shared bank get recorded audio and ship inside the app
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes about 10-25 minutes. When the audio cache is gone (GitHub drops caches unused for 7 days)
    # every clip is recorded again (about 35 minutes), then the tests run: allow for that, but stop a hung run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate content
        run: node tools/validate.js

      # Approved questions from the shared bank (never fails the build; the app also fetches them itself)
      - name: Pull approved bank questions
        run: node tools/fetch_bank.mjs

      # Reuse MP3s from earlier runs; only new or changed sentences are generated.
      # Restore and save are separate steps so the recordings are kept even when a later step (the tests) fails
      # or the run is cancelled; each run saves under its own key, the newest one is restored next time.
      - name: Restore audio cache
        uses: actions/cache/restore@v4
        with:
          path: audio
          key: audio-${{ hashFiles('data/*.js', 'data/hsk5/*.js', 'data/hsk4x/*.js', 'tools/gen_audio.py', 'tools/collect_texts.js') }}-${{ github.run_id }}
          restore-keys: |
            audio-${{ hashFiles('data/*.js', 'data/hsk5/*.js', 'data/hsk4x/*.js', 'tools/gen_audio.py', 'tools/collect_texts.js') }}-
            audio-

      - name: Generate audio (edge-tts)
        timeout-minutes: 50
        run: |
          pip install edge-tts
          command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          node tools/collect_texts.js > audio_texts.json
          python tools/gen_audio.py audio_texts.json

      - name: Save audio cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audio
          key: audio-${{ hashFiles('data/*.js', 'data/hsk5/*.js', 'data/hsk4x/*.js', 'tools/gen_audio.py', 'tools/collect_texts.js') }}-${{ github.run_id }}

      # Bundles + minifies (esbuild), splits start-up data from lazy data, stamps the version.
      - name: Build site
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2
          node tools/build.js _site "$GITHUB_SHA"

      # Content, the AI service (fake Gemini, no key) and browser tests on a simulated iPhone. A failure stops the deploy.
      - name: Tests
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          tests/run.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Speed check of the live site on a simulated mid-range phone. Informational only:
  # it never blocks a deploy. Open the run's log for the scores and a link to the full report.
  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun --collect.url="${{ needs.deploy.outputs.page_url }}"
